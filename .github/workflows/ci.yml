name: CI

# Definition of Done(AGENTS.md §4)을 자동 실행하는 검증 파이프라인.
# 워커(코드 변경)와 체커(이 CI)를 분리해, "통과 주장"이 아닌 "실제 통과"를 강제한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ① 정적 단계: typecheck + build + 단위 테스트(DB 불필요)
  backend:
    name: 백엔드 (정적 + 단위)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit + nest build
      - run: npm run test    # Jest 단위 (mocked repo, DB 불필요)

  # ② 런타임/행위 단계: supertest E2E (실제 HTTP + MariaDB)
  backend-e2e:
    name: 백엔드 E2E (supertest + MariaDB)
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pretty_four
          MYSQL_USER: app
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: apppass
      DB_NAME: pretty_four
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e   # POST /auth/register→201, 중복→409, /auth/login→200/401/400, /children 201(camelCase)/401

  # ③ E2E(종결) 단계: Docker로 실제 기동되는지 스모크 (worker≠checker)
  backend-smoke:
    name: 백엔드 Docker 기동 스모크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 스모크용 .env 생성 (더미 값)
        run: |
          cat > backend/.env <<'EOF'
          DB_NAME=pretty_four
          DB_USER=app
          DB_PASSWORD=apppass
          DB_ROOT_PASSWORD=rootpass
          JWT_SECRET=ci-smoke-secret
          JWT_EXPIRES_IN=7d
          OPENAI_API_KEY=ci
          ANTHROPIC_API_KEY=ci
          UPLOAD_DIR=/app/uploads
          EOF
      - name: 백엔드 + DB 기동
        run: docker compose up -d --build
      - name: 헬스 대기 (POST /auth/login → 400/401 = 서버 생존)
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/auth/login \
              -H 'Content-Type: application/json' -d '{}' || true)"
            if [ "$code" = "400" ] || [ "$code" = "401" ]; then
              echo "✓ 서버 생존 (HTTP $code)"; exit 0
            fi
            sleep 3
          done
          echo "✖ 백엔드가 시간 내 기동하지 않음"; docker compose logs backend; exit 1
      - name: 정리
        if: always()
        run: docker compose down -v

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pretty_four
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: |
          printf 'API_BASE_URL=http://localhost:3000\nKAKAO_NATIVE_APP_KEY=ci\nGOOGLE_CLIENT_ID=ci\n' > .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  arch-guard:
    name: 아키텍처 가드 (실행 가능 불변식)
    # AGENTS.md §5 불변식(보호 라우트 JwtAuthGuard + 모델 키 camelCase)을 매 커밋 강제.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/arch-guard.sh
