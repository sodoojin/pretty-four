name: CI

# Definition of Done(AGENTS.md §4)을 자동 실행하는 검증 파이프라인.
# 워커(코드 변경)와 체커(이 CI)를 분리해, "통과 주장"이 아닌 "실제 통과"를 강제한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ① 정적 단계: typecheck + build + 단위 테스트(DB 불필요)
  backend:
    name: 백엔드 (정적 + 단위)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check   # tsc --noEmit + nest build
      - run: npm run test    # Jest 단위 (mocked repo, DB 불필요)

  # ② 런타임/행위 단계: supertest E2E (실제 HTTP + MariaDB)
  backend-e2e:
    name: 백엔드 E2E (supertest + MariaDB)
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pretty_four
          MYSQL_USER: app
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: apppass
      DB_NAME: pretty_four
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e   # POST /auth/register→201, 중복→409, /auth/login→200/401/400, /children 201(camelCase)/401

  # ③ 이미지 빌드 검증: docker build만으로 Dockerfile 유효성 확인 (compose 실행 불가)
  # 이유: docker-compose.yml의 sprout-shared 네트워크는 external(sprout-infra 소유)이고
  #       backend-blue/green 서비스는 호스트 포트를 노출하지 않아 CI 러너에서 compose up 스모크가 불가능.
  #       대신 이미지 빌드 성공 여부로 Dockerfile·빌드 컨텍스트 유효성을 검증한다.
  backend-smoke:
    name: 백엔드 Docker 이미지 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker 이미지 빌드 (Dockerfile 유효성 검증)
        run: docker build ./backend -t pretty-four-backend:ci

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pretty_four
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true
      - run: |
          printf 'API_BASE_URL=http://localhost:3000\nKAKAO_NATIVE_APP_KEY=ci\nGOOGLE_CLIENT_ID=ci\n' > .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  arch-guard:
    name: 아키텍처 가드 (실행 가능 불변식)
    # AGENTS.md §5 불변식(보호 라우트 JwtAuthGuard + 모델 키 camelCase)을 매 커밋 강제.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/arch-guard.sh
