# 인프라 정책: 별도 MariaDB를 띄우지 않는다.
# 공유 인프라(sprout-infra)의 MariaDB를 쓰고, 논리 database 'pretty_four' + 전용 유저로 격리한다.
# blue/green 무중단 배포 + Caddy 리버스 프록시는 유지(이 repo 소유).
# 사전: (cd ../sprout-infra && docker compose up -d)  — DB·네트워크·논리 DB는 sprout-infra가 소유.
version: '3.8'

services:
  backend-blue:
    image: pretty-four-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 공유 네트워크(sprout-shared)의 db 서비스로 접속. 전용 유저 + 논리 DB.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pretty_four}
      DB_USER: ${DB_USER:-pretty_four}
      DB_PASSWORD: ${DB_PASSWORD:-pretty_four_pw}
      INSTANCE_NAME: blue
    volumes:
      - audio_tmp:/app/uploads
    networks:
      - app
      - sprout-shared
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backend-green:
    image: pretty-four-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pretty_four}
      DB_USER: ${DB_USER:-pretty_four}
      DB_PASSWORD: ${DB_PASSWORD:-pretty_four_pw}
      INSTANCE_NAME: green
    volumes:
      - audio_tmp:/app/uploads
    networks:
      - app
      - sprout-shared
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      - backend-blue
      - backend-green

networks:
  # caddy ↔ backend 내부 통신
  app:
  # backend ↔ 공유 DB (sprout-infra 소유)
  sprout-shared:
    external: true
    name: sprout-shared

volumes:
  audio_tmp:
  caddy_data:
  caddy_config:
