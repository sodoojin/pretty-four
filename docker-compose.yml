# 인프라 정책: DB·엣지 리버스 프록시는 공유 인프라(sprout-infra)가 소유.
# 이 repo는 backend-blue/green(무중단 배포 인스턴스)만 띄우고, 공유 네트워크 sprout-shared에
# 고유 alias로 노출한다. 호스트명 라우팅 + blue/green failover는 sprout-infra 엣지 Caddy가 담당
# (caddy/sites/pretty-four.caddy). DB는 논리 database 'pretty_four' + 전용 유저로 격리.
# 사전: (cd ../sprout-infra && docker compose up -d)  — DB·네트워크·엣지 Caddy는 sprout-infra 소유.
version: '3.8'

services:
  backend-blue:
    image: pretty-four-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pretty_four}
      DB_USER: ${DB_USER:-pretty_four}
      DB_PASSWORD: ${DB_PASSWORD:-pretty_four_pw}
      INSTANCE_NAME: blue
    volumes:
      - audio_tmp:/app/uploads
    networks:
      sprout-shared:
        aliases:
          - pretty-four-backend-blue
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backend-green:
    image: pretty-four-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pretty_four}
      DB_USER: ${DB_USER:-pretty_four}
      DB_PASSWORD: ${DB_PASSWORD:-pretty_four_pw}
      INSTANCE_NAME: green
    volumes:
      - audio_tmp:/app/uploads
    networks:
      sprout-shared:
        aliases:
          - pretty-four-backend-green
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

# 공유 인프라(sprout-infra)가 만든 네트워크를 외부 네트워크로 참조.
networks:
  sprout-shared:
    external: true
    name: sprout-shared

volumes:
  audio_tmp:
