<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이쁜네살 · 앱 아이콘 후보</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#EEF2F8;color:#1F2A37;padding:40px 20px 80px;text-align:center}
  h1{font-size:24px;font-weight:800}
  p{color:#7A8694;margin-top:8px}
  .grid{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-top:36px}
  .item{display:flex;flex-direction:column;align-items:center;gap:14px}
  .num{font-size:13px;font-weight:800;color:#4F7EF0}
  /* iOS 둥근 마스크 (superellipse 근사) */
  .icon{width:180px;height:180px;border-radius:40px;box-shadow:0 14px 30px -12px rgba(31,42,55,.4);background-size:cover}
  .row2{display:flex;gap:14px;margin-top:6px}
  .small{width:60px;height:60px;border-radius:14px;box-shadow:0 6px 14px -8px rgba(31,42,55,.4);background-size:cover}
  .desc{font-size:12px;color:#7A8694;max-width:200px}
</style>
</head>
<body>
  <h1>이쁜네살 — 앱 아이콘 후보</h1>
  <p>홈 화면에 놓였을 때 모습(둥근 마스크 적용). 마음에 드는 번호를 알려주세요.</p>
  <div class="grid">
    <div class="item">
      <div class="num">A</div>
      <div class="icon" style="background-image:url('icons/icon_a.png')"></div>
      <div class="row2">
        <div class="small" style="background-image:url('icons/icon_a.png')"></div>
        <div class="small" style="background-image:url('icons/icon_a.png')"></div>
      </div>
      <div class="desc">그라데이션 배경 + 흰 하트. 선명하고 또렷, 작은 크기에서도 잘 보임.</div>
    </div>
    <div class="item">
      <div class="num">B</div>
      <div class="icon" style="background-image:url('icons/icon_b.png')"></div>
      <div class="row2">
        <div class="small" style="background-image:url('icons/icon_b.png')"></div>
        <div class="small" style="background-image:url('icons/icon_b.png')"></div>
      </div>
      <div class="desc">연한 파스텔 배경 + 그라데이션 하트. 로고 하트와 동일 톤, 부드럽고 산뜻.</div>
    </div>
    <div class="item">
      <div class="num">C</div>
      <div class="icon" style="background-image:url('icons/icon_c.png')"></div>
      <div class="row2">
        <div class="small" style="background-image:url('icons/icon_c.png')"></div>
        <div class="small" style="background-image:url('icons/icon_c.png')"></div>
      </div>
      <div class="desc">그라데이션 배경 + 흰 하트 + 반짝임. 활기차고 포인트 있음.</div>
    </div>
  </div>
  <p style="margin-top:40px;font-size:12px">작은 미리보기는 실제 홈 화면의 작은 아이콘 크기 느낌입니다.</p>
</body>
</html>
